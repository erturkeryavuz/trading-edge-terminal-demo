<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F13" />
      <stop offset="100%" stop-color="#12161D" />
    </linearGradient>
    <radialGradient id="sGlow" cx="72%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#B49A78" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0D0F13" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191D25" />
      <stop offset="100%" stop-color="#13171D" />
    </linearGradient>
    <linearGradient id="sBarSlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#608A95" />
      <stop offset="100%" stop-color="#38545D" />
    </linearGradient>
    <linearGradient id="sBarGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7BE98" />
      <stop offset="100%" stop-color="#A88A62" />
    </linearGradient>
    <filter id="sShadow" x="-10%" y="-10%" width="120%" height="122%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.50" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#sBg)" />
  <rect width="1280" height="640" fill="url(#sGlow)" />
  <rect x="22" y="22" width="1236" height="596" rx="20" fill="none" stroke="#232934" stroke-width="1.2" />

  <!-- Left Bold Product Identity (Primary Anchor, Thumbnail-Optimized) -->
  <text x="74" y="214" fill="#F4F0E8" font-family="Georgia, 'Times New Roman', serif"
        font-size="78" font-weight="700" letter-spacing="-0.8">Trading Edge</text>
  <text x="74" y="298" fill="#DAC3A2" font-family="Georgia, 'Times New Roman', serif"
        font-size="78" font-style="italic" font-weight="400" letter-spacing="-0.6">Terminal</text>
  <rect x="76" y="332" width="58" height="3" rx="1.5" fill="#B49A78" />

  <text x="76" y="400" fill="#D0D6DF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="25.5" font-weight="400">Company fundamentals, risk checks,</text>
  <text x="76" y="438" fill="#D0D6DF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="25.5" font-weight="400">and Treasury yields in one workspace.</text>

  <text x="76" y="548" fill="#7D8695" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16">Historical snapshot (Nov 2026) · Research only</text>

  <!-- Right Sculptural Software Workspace Preview (No Giant Apple KPIs, No Ambiguous Numeric Footer) -->
  <g filter="url(#sShadow)">
    <rect x="640" y="76" width="564" height="488" rx="20" fill="url(#sCard)" stroke="#2E3542" stroke-width="1.5" />
  </g>

  <!-- Subtle Workspace Bar -->
  <path d="M 660,76 H 1184 A 20,20 0 0 1 1204,96 V 132 H 640 V 96 A 20,20 0 0 1 660,76 Z" fill="#1D222C" />
  <line x1="640" y1="132" x2="1204" y2="132" stroke="#2A303D" stroke-width="1" />
  <circle cx="674" cy="104" r="5" fill="#B49A78" />
  <text x="692" y="109" fill="#E6E1D7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="700">Companies</text>
  <text x="812" y="109" fill="#7F8898" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="500">Screener</text>
  <text x="914" y="109" fill="#7F8898" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="500">Risks</text>
  <text x="992" y="109" fill="#7F8898" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="500">Treasury</text>

  <!-- Clean Proportional Chart Title -->
  <text x="684" y="186" fill="#F4F0E8" font-family="Georgia, 'Times New Roman', serif"
        font-size="25" font-weight="700">Revenue &amp; Operating Margin</text>
  <text x="1158" y="184" text-anchor="end" fill="#C4A984" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" font-weight="700">AAPL</text>

  <!-- Clean Data-Grounded 5-Year Chart -->
  <line x1="686" y1="387.4" x2="1156" y2="387.4" stroke="#232935" stroke-width="1" /><line x1="686" y1="310.9" x2="1156" y2="310.9" stroke="#232935" stroke-width="1" /><line x1="686" y1="232.0" x2="1156" y2="232.0" stroke="#232935" stroke-width="1" />
  <line x1="686" y1="464" x2="1156" y2="464" stroke="#333B4A" stroke-width="1.5" />
  <rect x="704.0" y="339.2" width="58" height="124.8" rx="7" fill="url(#sBarSlate)" /><text x="733.0" y="494" text-anchor="middle" fill="#9BA4B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">FY22</text><rect x="798.0" y="342.7" width="58" height="121.3" rx="7" fill="url(#sBarSlate)" /><text x="827.0" y="494" text-anchor="middle" fill="#9BA4B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">FY23</text><rect x="892.0" y="340.3" width="58" height="123.7" rx="7" fill="url(#sBarSlate)" /><text x="921.0" y="494" text-anchor="middle" fill="#9BA4B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">FY24</text><rect x="986.0" y="332.3" width="58" height="131.7" rx="7" fill="url(#sBarSlate)" /><text x="1015.0" y="494" text-anchor="middle" fill="#9BA4B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">FY25</text><rect x="1080.0" y="312.5" width="58" height="151.5" rx="7" fill="url(#sBarGold)" /><text x="1109.0" y="494" text-anchor="middle" fill="#F3EFE7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">FY26</text>
  <path d="M 733.0,269.9 L 827.0,272.3 L 921.0,263.4 L 1015.0,261.0 L 1109.0,255.6" fill="none" stroke="#67C393" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="733.0" cy="269.9" r="5" fill="#151921" stroke="#67C393" stroke-width="3.2" /><circle cx="827.0" cy="272.3" r="5" fill="#151921" stroke="#67C393" stroke-width="3.2" /><circle cx="921.0" cy="263.4" r="5" fill="#151921" stroke="#67C393" stroke-width="3.2" /><circle cx="1015.0" cy="261.0" r="5" fill="#151921" stroke="#67C393" stroke-width="3.2" /><circle cx="1109.0" cy="255.6" r="6.5" fill="#67C393" stroke="#67C393" stroke-width="3.2" />

  <!-- Clean Minimal Legend Footer (Zero Ambiguous Numeric Bundle) -->
  <line x1="684" y1="516" x2="1158" y2="516" stroke="#262C37" stroke-width="1" />
  <rect x="684" y="534" width="14" height="10" rx="2.5" fill="#B49A78" />
  <text x="706" y="544" fill="#AEB6C3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="500">Annual Revenue</text>
  <line x1="862" y1="539" x2="888" y2="539" stroke="#67C393" stroke-width="3.5" />
  <circle cx="875" cy="539" r="3.8" fill="#67C393" />
  <text x="898" y="544" fill="#AEB6C3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="500">Operating Margin</text>
</svg>
